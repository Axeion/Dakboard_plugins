<!--
  DakBoard Widget Block: Nutrislice School Lunch Menu
  ===================================================
  HOW TO USE:
  1. On your DakBoard Custom Screen, click "Add a Block" -> "Widget Block".
  2. Paste this entire file's contents into the widget's code/settings box.
  3. Edit the CONFIG section below (DISTRICT / SCHOOL_SLUG / MENU_TYPE).
  4. Resize the block on your DakBoard layout as needed.

  FINDING YOUR SETTINGS:
  Open your school's menu on the Nutrislice website and read them off the URL:

      https://elkhornweb.nutrislice.com/menu/elkhorn-high-school/lunch/2026-08-19
             ^^^^^^^^^^                ^^^^^^^^^^^^^^^^^^^ ^^^^^
             DISTRICT                  SCHOOL_SLUG         MENU_TYPE

  MENU_TYPE is whatever your district named that menu, so it is not always
  "lunch" -- districts use things like "hs-lunch", "lunch-2" or "secondary-lunch".
  Always copy it from the URL rather than guessing. If you cannot find your
  school's page, https://<DISTRICT>.nutrislice.com/menu/api/schools/?format=json
  lists every school in the district along with its slug.

  IF THE MENU NEVER LOADS:
  Nutrislice does not send CORS headers, so a plain fetch() is usually refused.
  The widget handles that automatically by falling back to JSONP, which works
  for most districts with no extra setup. Only if that also fails do you need
  the companion Cloudflare Worker (nutrislice-proxy-worker.js) -- deploy it and
  paste its URL into PROXY_URL below.

  TIP: set DEBUG_MODE = true to print the raw API response on screen. That is
  the fastest way to confirm your DISTRICT / SCHOOL_SLUG / MENU_TYPE are right
  and to see what food categories your district uses.
-->

<div id="ns-widget" style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; width: 100%; height: 100%; box-sizing: border-box; padding: 12px;">
  <div id="ns-title" style="font-size: 1.4em; font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85;">
    Lunch Menu
  </div>
  <div id="ns-date" style="font-size: 0.95em; margin-bottom: 10px; opacity: 0.6;"></div>
  <div id="ns-content" style="font-size: 1.1em; line-height: 1.5;">
    Loading menu…
  </div>
</div>

<script>
// Installed first, on purpose: if the main script below fails to parse or throws
// while reading its CONFIG, the widget would otherwise sit on "Loading menu…"
// forever with nothing on screen and nothing in the block to explain it.
(function () {
  function show(msg) {
    var el = document.getElementById("ns-content");
    if (!el) return;
    el.innerHTML = '<div style="opacity:0.8; font-size:0.7em; line-height:1.4;">' +
      "Widget error: " +
      String(msg).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
      "</div>";
  }

  window.addEventListener("error", function (e) {
    show((e && e.message) || "script error");
  });

  // Nothing at all rendered? Say so rather than showing "Loading" indefinitely.
  setTimeout(function () {
    var el = document.getElementById("ns-content");
    if (el && /Loading menu/.test(el.textContent || "")) {
      show("the script never finished running. Check the CONFIG block — text " +
           'values need quotes, e.g. DEBUG_MODE = "items", not DEBUG_MODE = items.');
    }
  }, 20000);
})();
</script>

<script>
(function () {
  // ---------------- CONFIG ----------------
  var DISTRICT    = "elkhornweb";          // <-- subdomain, e.g. "elkhornweb" in elkhornweb.nutrislice.com
  var SCHOOL_SLUG = "elkhorn-high-school"; // <-- school segment of the menu URL
  var MENU_TYPE   = "lunch";               // <-- menu segment of the menu URL
  var PROXY_URL   = "";                    // <-- e.g. "https://nutrislice-proxy.yourname.workers.dev"

  // Show tomorrow's menu once it is this hour or later (24h clock), so the
  // board stops advertising a lunch that has already been served.
  // Set to null to always show today.
  var ROLL_OVER_HOUR = 14;

  // Force a specific date while setting the widget up, e.g. "2026-08-19".
  // Leave blank for normal operation.
  var DATE_OVERRIDE = "";

  // Heading text. The widget prefixes "Today's" / "Tomorrow's" automatically,
  // which matters because ROLL_OVER_HOUR can move it off today.
  var TITLE = "Lunch Menu";
  var SHOW_RELATIVE_DAY = true;   // "Today's Lunch Menu" vs plain "Lunch Menu"
  var SHOW_DATE = true;           // second line, e.g. "Tuesday, August 18"
  var DATE_STYLE = "long";        // "long"  -> Tuesday, August 18
                                  // "short" -> Tue, Aug 18

  // Diagnostics:
  //   false     - normal operation
  //   "items"   - compact list of every row the API returned for the day, with
  //               the fields that decide whether it is shown. Use this when
  //               something is listed that shouldn't be (or vice versa).
  //   true      - the whole raw JSON response
  // On a failed request, any truthy value shows every URL tried and why it failed.
  var DEBUG_MODE = false;

  // Food categories to hide (milk cartons, condiments, etc). Matched against
  // each item's food category, case-insensitive. Leave empty to show all.
  var SKIP_CATEGORIES = ["milk", "milks", "condiment", "condiments",
                         "beverage", "beverages"];

  // Hide rows that carry no food category at all. Districts use these as
  // in-list station labels ("T4- Grill Baskets", "Fast Takes - Grab & Go
  // Meals") -- they arrive as ordinary food entries, so nothing else marks
  // them as headings. Real menu items are categorised. Set false if your
  // district leaves the category blank on food you actually want listed.
  var SKIP_UNCATEGORIZED = true;

  // Station headings ("Deli", "Main Line", ...).
  //   "auto"   - follow the district's own setting, like the Nutrislice site does
  //   "always" - always show them, even ones the district hides
  //   "never"  - never show them; render one flat list
  // Districts often name stations internally ("T4-Adventure") and hide them,
  // so "auto" keeps those off your board.
  var SHOW_STATIONS = "auto";
  // -----------------------------------------

  // Accepts true, "items", "raw" and the usual near-misses, so a slightly wrong
  // debug value still does something useful instead of silently doing nothing.
  function debugMode() {
    var v = DEBUG_MODE;
    if (v === true) return "raw";
    if (typeof v !== "string") return false;
    var t = v.toLowerCase().replace(/^\s+|\s+$/g, "");
    if (t === "items" || t === "item" || t === "rows") return "items";
    if (t === "" || t === "false" || t === "off") return false;
    return "raw";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function ymd(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  // The date whose menu we want, as a local (not UTC) calendar date.
  function targetDate() {
    if (DATE_OVERRIDE) return DATE_OVERRIDE;
    var d = new Date();
    if (ROLL_OVER_HOUR !== null && d.getHours() >= ROLL_OVER_HOUR) {
      d.setDate(d.getDate() + 1);
    }
    return ymd(d);
  }

  // Nutrislice answers on both of these; which one a district uses varies,
  // so try them in order before giving up. The dedicated api host is the one
  // that generally answers, so it goes first.
  function apiHosts() {
    return [DISTRICT + ".api.nutrislice.com", DISTRICT + ".nutrislice.com"];
  }

  function menuPath(dateStr, format) {
    var parts = dateStr.split("-");
    // Nutrislice serves a whole week at a time; any date in the week works.
    return "/menu/api/weeks/school/" + encodeURIComponent(SCHOOL_SLUG) +
           "/menu-type/" + encodeURIComponent(MENU_TYPE) +
           "/" + parts[0] + "/" + parts[1] + "/" + parts[2] +
           "/?format=" + encodeURIComponent(format);
  }

  function buildUrl(dateStr, host, format) {
    var path = menuPath(dateStr, format);
    if (PROXY_URL) {
      // Proxy forwards ?host= and ?path= to the real Nutrislice endpoint
      return PROXY_URL.replace(/\/$/, "") +
             "/?host=" + encodeURIComponent(host) +
             "&path=" + encodeURIComponent(path);
    }
    return "https://" + host + path;
  }

  // A <script> tag isn't subject to CORS, so JSONP gets the menu even when the
  // browser refuses a plain fetch(). Nutrislice has spelled the format both
  // "json-p" and "jsonp" over the years, hence the two attempts below.
  function fetchJsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = "nsCb" + Date.now() + Math.floor(Math.random() * 1e6);
      var script = document.createElement("script");
      var timer;

      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = function (data) { cleanup(); resolve(data); };

      timer = setTimeout(function () {
        cleanup();
        reject(new Error("JSONP timed out"));
      }, timeoutMs || 10000);

      script.onerror = function () {
        cleanup();
        reject(new Error("JSONP request failed"));
      };

      script.src = url + "&callback=" + cb;
      document.head.appendChild(script);
    });
  }

  // The transport that worked last time, replayed first on later refreshes so
  // hourly reloads stop re-failing through the same dead options.
  var lastGood = null;

  function sameTransport(a, b) {
    return a && b && a.kind === b.kind && a.host === b.host && a.format === b.format;
  }

  // Ordered list of everything worth trying before giving up.
  function buildAttempts() {
    var hosts = apiHosts();
    var list = [];
    var i;

    // The proxy already solves CORS, so there is nothing to fall back to.
    if (PROXY_URL) {
      for (i = 0; i < hosts.length; i++) {
        list.push({ kind: "fetch", host: hosts[i], format: "json" });
      }
    } else {
      for (i = 0; i < hosts.length; i++) {
        list.push({ kind: "fetch", host: hosts[i], format: "json" });
      }
      // JSONP sidesteps CORS entirely; Nutrislice has spelled the format both
      // ways over the years, hence two attempts per host.
      for (i = 0; i < hosts.length; i++) {
        list.push({ kind: "jsonp", host: hosts[i], format: "json-p" });
        list.push({ kind: "jsonp", host: hosts[i], format: "jsonp" });
      }
    }

    if (lastGood) {
      for (i = 0; i < list.length; i++) {
        if (sameTransport(list[i], lastGood)) {
          list.unshift(list.splice(i, 1)[0]);
          break;
        }
      }
    }
    return list;
  }

  // "2026-08-18" as a LOCAL date. new Date("2026-08-18") would parse as UTC
  // midnight, which lands on the previous day west of Greenwich and would
  // print the wrong weekday.
  function dateFromYmd(str) {
    var p = String(str).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function relativeDay(dateStr) {
    var today = new Date();
    if (dateStr === ymd(today)) return "Today's";
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    if (dateStr === ymd(tomorrow)) return "Tomorrow's";
    return "";
  }

  function formatDate(dateStr) {
    var d = dateFromYmd(dateStr);
    var opts = DATE_STYLE === "short"
      ? { weekday: "short", month: "short", day: "numeric" }
      : { weekday: "long", month: "long", day: "numeric" };
    try {
      return d.toLocaleDateString(undefined, opts);
    } catch (e) {
      return dateStr;
    }
  }

  function renderHeading(dateStr) {
    var rel = SHOW_RELATIVE_DAY ? relativeDay(dateStr) : "";
    document.getElementById("ns-title").textContent =
      (rel ? rel + " " : "") + TITLE;

    var dateEl = document.getElementById("ns-date");
    dateEl.textContent = SHOW_DATE ? formatDate(dateStr) : "";
    dateEl.style.display = SHOW_DATE ? "" : "none";
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function setContent(html) {
    document.getElementById("ns-content").innerHTML = html;
  }

  function renderError(msg) {
    setContent('<div style="opacity:0.7;">' + msg + '</div>');
  }

  // A failed attempt tells us a lot about *why* it failed, so keep the detail
  // instead of collapsing everything into "menu unavailable".
  //   - got an HTTP status  -> the request completed, so CORS is fine and the
  //                            status points at a bad slug / menu type
  //   - fetch itself threw  -> CORS block, DNS, or no network: nothing to read
  function describeFailure(attempts) {
    var sawStatus = false;
    for (var i = 0; i < attempts.length; i++) {
      if (attempts[i].status) sawStatus = true;
    }

    if (sawStatus) {
      var s = attempts[attempts.length - 1].status;
      if (s === 404) {
        return "Menu not found (HTTP 404). The connection worked, so check " +
               "SCHOOL_SLUG and MENU_TYPE against your Nutrislice menu URL.";
      }
      return "Nutrislice returned HTTP " + s + ".";
    }
    return "Could not reach Nutrislice — direct and JSONP requests both " +
           "failed. Deploy the proxy worker and set PROXY_URL.";
  }

  function renderDiagnostic(attempts) {
    var html = '<div style="opacity:0.75; margin-bottom:8px;">' +
               escapeHtml(describeFailure(attempts)) + '</div>';
    html += '<div style="font-size:0.6em; line-height:1.4; opacity:0.85;">';
    html += '<div style="margin-bottom:4px;">Tried ' + attempts.length + ' URL(s):</div>';
    for (var i = 0; i < attempts.length; i++) {
      var a = attempts[i];
      html += '<div style="margin-bottom:6px;">' +
              '<div style="word-break:break-all;">' + escapeHtml(a.url) + '</div>' +
              '<div style="opacity:0.7;">' + escapeHtml(a.kind || "fetch") + ' &rarr; ' +
              escapeHtml(a.status ? "HTTP " + a.status : a.error) + '</div></div>';
    }
    html += '<div style="opacity:0.7;">Open one of those URLs in a browser tab: ' +
            'JSON means the endpoint is right and you need the proxy; ' +
            'a 404 page means the slug or menu type is wrong.</div>';
    html += '</div>';
    setContent(html);
  }

  // Nutrislice nests the category differently across districts, so check
  // every spelling we have seen before deciding an item is hidden.
  function categoryOf(item) {
    var food = item.food || {};
    return String(
      food.food_category || food.category || item.food_category || item.category || ""
    ).toLowerCase().trim();
  }

  function isHidden(item) {
    var cat = categoryOf(item);
    if (!cat) return SKIP_UNCATEGORIZED;
    for (var i = 0; i < SKIP_CATEGORIES.length; i++) {
      if (SKIP_CATEGORIES[i].toLowerCase() === cat) return true;
    }
    return false;
  }

  function nameOf(item) {
    var food = item.food || {};
    var name = food.name || item.text || "";
    return String(name).trim();
  }

  function findDay(data, dateStr) {
    var days = (data && data.days) || [];
    for (var i = 0; i < days.length; i++) {
      if (days[i] && days[i].date === dateStr) return days[i];
    }
    return null;
  }

  // Each station's heading is configured per menu in the day's menu_info,
  // keyed by the item's menu_id. Nutrislice's own site honours these, so
  // "auto" does too rather than exposing internal station names.
  function sectionTitleFor(day, item) {
    if (SHOW_STATIONS === "never") return "";

    var info = (day && day.menu_info) || {};
    var entry = info[String(item.menu_id)] || {};
    var opts = entry.section_options || {};

    if (SHOW_STATIONS === "auto" && opts.use_section_title === false) return "";

    return String(opts.display_name || item.text || "").trim();
  }

  function renderGroups(groups) {
    var html = "";
    for (var g = 0; g < groups.length; g++) {
      var group = groups[g];
      if (!group.items.length) continue;
      html += '<div style="margin-bottom: 12px;">';
      if (group.title) {
        html += '<div style="font-weight:600; opacity:0.8; margin-bottom:4px;">' +
                escapeHtml(group.title) + '</div>';
      }
      html += '<ul style="margin:0; padding-left: 1.2em;">';
      for (var i = 0; i < group.items.length; i++) {
        html += "<li>" + escapeHtml(group.items[i]) + "</li>";
      }
      html += '</ul></div>';
    }
    return html;
  }

  // Shows what the parser sees for each row, so a wrongly-included or
  // wrongly-hidden item can be traced to the exact field responsible.
  function renderItemDebug(data, dateStr) {
    var day = findDay(data, dateStr);
    if (!day) {
      renderError("No day matching " + dateStr + " in the response.");
      return;
    }

    var items = day.menu_items || [];
    var rows = '<div style="font-size:0.6em; line-height:1.35; opacity:0.9;">';
    rows += '<div style="margin-bottom:6px;">' + escapeHtml(dateStr) + " — " +
            items.length + ' rows</div>';

    for (var i = 0; i < items.length; i++) {
      var item = items[i] || {};
      var food = item.food || {};
      var flags = [];
      if (item.is_section_title) flags.push("section_title");
      if (item.is_station_header) flags.push("station_header");
      if (item.blank_line) flags.push("blank_line");
      if (isHidden(item)) {
        flags.push(categoryOf(item) ? "HIDDEN-by-category" : "HIDDEN-no-category");
      }

      rows += '<div style="margin-bottom:4px;">' +
        escapeHtml((food.name || item.text || "(no name)")) +
        '<div style="opacity:0.65;">food_category=' + escapeHtml(String(food.food_category)) +
        ' category=' + escapeHtml(String(item.category)) +
        ' menu_id=' + escapeHtml(String(item.menu_id)) +
        (flags.length ? ' [' + escapeHtml(flags.join(", ")) + ']' : '') +
        '</div></div>';
    }
    rows += '</div>';
    setContent(rows);
    console.log("Nutrislice day rows:", items);
  }

  function renderMenu(data, dateStr) {
    if (debugMode() === "raw") {
      setContent('<pre style="white-space: pre-wrap; font-size: 0.55em; line-height:1.3; opacity:0.9;">' +
                 escapeHtml(JSON.stringify(data, null, 2)) + '</pre>');
      console.log("Nutrislice raw response:", data);
      return;
    }

    if (debugMode() === "items") {
      renderItemDebug(data, dateStr);
      return;
    }

    var day = findDay(data, dateStr);
    if (!day) {
      renderError("No menu scheduled for today.");
      return;
    }

    var items = day.menu_items || [];
    var groups = [{ title: "", items: [] }];
    var seen = {};

    function currentGroup() { return groups[groups.length - 1]; }

    for (var i = 0; i < items.length; i++) {
      var item = items[i] || {};

      // Station headings carry no food, just text.
      if (item.is_section_title || item.is_station_header) {
        var title = sectionTitleFor(day, item);
        // Hidden headings would otherwise split the list into unlabelled
        // chunks, so only start a new group when there is a title to show.
        if (title) groups.push({ title: title, items: [] });
        continue;
      }

      if (isHidden(item)) continue;

      var name = nameOf(item);
      if (!name) continue;

      // Districts often repeat the same item across stations.
      var key = name.toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;

      currentGroup().items.push(name);
    }

    var html = renderGroups(groups);
    setContent(html || "No items listed today.");
  }

  function loadMenu() {
    var dateStr = targetDate();
    renderHeading(dateStr);
    var attempts = buildAttempts();
    var results = [];

    function succeeded(attempt, data) {
      lastGood = attempt;
      renderMenu(data, dateStr);
    }

    function tryNext(index) {
      if (index >= attempts.length) {
        console.error("Nutrislice widget: all attempts failed", results);
        if (debugMode()) renderDiagnostic(results);
        else renderError(describeFailure(results));
        return;
      }

      var attempt = attempts[index];
      var url = buildUrl(dateStr, attempt.host, attempt.format);

      function failed(detail) {
        results.push({ url: url, kind: attempt.kind, error: detail });
        tryNext(index + 1);
      }

      if (attempt.kind === "jsonp") {
        fetchJsonp(url)
          .then(function (data) { succeeded(attempt, data); })
          .catch(function (err) { failed(String(err && err.message || err)); });
        return;
      }

      fetch(url)
        .then(function (res) {
          if (!res.ok) {
            results.push({ url: url, kind: attempt.kind, status: res.status });
            return tryNext(index + 1);
          }
          return res.json().then(function (data) { succeeded(attempt, data); });
        })
        .catch(function (err) { failed(String(err && err.message || err)); });
    }

    tryNext(0);
  }

  loadMenu();
  // Refresh once an hour in case DakBoard keeps the page open across midnight
  setInterval(loadMenu, 60 * 60 * 1000);
})();
</script>
